<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Read Quran Anywhere">
        <link rel="icon" type="image/png" href="/quran.png?v=1">
        <title>QuranHTML V0.1</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #1a4d2e 0%, #0f3460 50%, #1a4d2e 100%);
                min-height: 100vh;
                font-family: Arial, sans-serif;
                padding: 30px 20px;
            }

            .container {
                max-width: 800px;
                margin: 0 auto;
            }

            h1 {
                text-align: center;
                color: #d6a85a;
                font-size: 2.5em;
                margin-bottom: 10px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            }

            #I {
                text-align: center;
                color: #ffffff;
                font-size: 1.1em;
                margin-bottom: 40px;
            }

            h2 {
                text-align: center;
                color: #d6a85a;
                font-size: 1.8em;
                margin: 40px 0 30px;
            }

            h3 {
                color: #3d92a1;
                text-align: center;
                padding: 15px;
                margin: 15px 0;
                background: rgba(255, 255, 255, 0.9);
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                transition: all 0.3s ease;
            }

            h3:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
                background: rgba(255, 255, 255, 1);
            }

            a {
                color: #1a8917;
                text-decoration: none;
                font-weight: 600;
                font-size: 1.05em;
                transition: color 0.3s ease;
            }

            a:hover {
                color: #d6a85a;
                text-decoration: underline;
            }

            #E {
                border: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>☪️ QuranHTML</h1>
            <p id="I">Read the quran anywhere in any device</p>
            
            <h2>Surahs</h2>
            
            <h3 id="E"><a href="fatiha.html">📖 Fatiha</a></h3>
            <h3 id="E">✨ More coming in V0.2!</h3>
        </div>
    </body>
</html>
